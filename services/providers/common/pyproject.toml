[project]
name = "surplusflow-provider-common"
version = "0.1.0"
description = "Shared schemas, DB models, and x402 helpers for the SurplusFlow marketplace and provider simulators (Person 3)."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.7",
  "sqlalchemy>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["surplusflow_provider_common"]
