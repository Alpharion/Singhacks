[project]
name = "surplusflow-marketplace"
version = "0.1.0"
description = "SurplusFlow marketplace: offer/quote discovery and reservation status (Person 3)."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "sqlalchemy>=2.0",
  "surplusflow-provider-common",
]

[tool.uv.sources]
surplusflow-provider-common = { path = "../providers/common", editable = true }

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
