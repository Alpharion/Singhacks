[project]
name = "surplusflow-buyer-agent"
version = "1.0.0"
description = "SurplusFlow buyer agent: objective parsing, deterministic procurement optimizer, and autonomous purchase orchestration."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "httpx>=0.27",
    "openai>=1.50",
    "python-dotenv>=1.0",
    # Windows ships no system tz database, so zoneinfo cannot resolve
    # SURPLUSFLOW_TIMEZONE and every /api/procure fails with
    # ZoneInfoNotFoundError. Harmless where the OS already provides one.
    "tzdata>=2024.1",
]

[project.optional-dependencies]
# Real XRPL settlement. Only needed for BUYER_AGENT_PAYMENT_MODE=x402; the agent
# runs fully against fixtures and simulated payments without it.
x402 = ["surplusflow-payments"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "jsonschema>=4.23",
    "surplusflow-payments",
]

[tool.uv.sources]
surplusflow-payments = { path = "../../packages/payments", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/buyer_agent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:buyer_agent.*"]
